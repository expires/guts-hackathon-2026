- id: bills.price_cap_rise
  area: bills
  emoji: "🧢"
  title: The price cap rises
  text: "A typical energy bill is now £{cap_now:,.0f} a year, up from £{cap_prev:,.0f}. Cutting use by a tenth saves £{saving:,.0f}."
  concept_id: price-cap
  tags: [energy_bill]
  eligible:
    age: [18, 110]
    when: not energy_fixed
  probability: 1 if energy_tariff - prev_energy_tariff > 150 else 0
  facts:
    cap_now: round(energy_tariff)
    cap_prev: round(prev_energy_tariff)
    rise: cap_now - cap_prev
    saving: round(cap_now * 0.1)
  choices:
    - id: keep
      label: Carry on as normal
      emoji: "🤷"
      hint: "-£{rise:,.0f} this year"
      default: true
      text: "You paid £{rise:,.0f} more for energy."
      good: false
      effects: { cash: -rise }
    - id: cut_use
      label: Use less energy
      emoji: "🧦"
      aliases: [cut]
      hint: "Save £{saving:,.0f}"
      text: "You turned the heating down a notch and saved £{saving:,.0f}."
      good: true
      effects: { cash: saving - rise, happiness: -1 }

