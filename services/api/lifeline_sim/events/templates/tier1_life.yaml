      label: Keep your car
      emoji: "🚗"
      hint: No new cost
      default: true
      text: "You keep your car."
      good: true
      effects: { }
    - id: finance
      label: Sign up
      emoji: "✍️"
      hint: "£{monthly:,.0f} a month"
      text: "You drive away in a new car for £{monthly:,.0f} a month."
      good: false
      effects: { living: monthly - current_running, happiness: 5 }

