# Tier 1 car, health, family and place events. Schema: lifeline_sim/events/schema.py

- id: car.hybrid_switch
  area: car
  emoji: "🔋"
  title: Swap to a cheaper car to run?
  text: "Fuel rose {fuel_pct:.0f}% this year. A used hybrid costs £{swap_cost:,.0f} after selling yours, and saves about £{fuel_saving:,.0f} a year."
  concept_id: car-costs
  eligible:
    when: has_car
  probability: clamp((fuel_price_change - 8) / 40, 0, 0.3)
  facts:
    fuel_pct: fuel_price_change
    swap_cost: round(4000 * price_level)
    fuel_saving: round(1400 * price_level * 0.35)
    monthly: round(fuel_saving / 12)
  choices:
    - id: keep
      label: Keep your car
      emoji: "🚗"
      hint: No upfront cost
      default: true
      text: "You keep your car."
      good: true
      effects: { }
    - id: swap
      label: Swap to a hybrid
      emoji: "🔋"
      hint: "-£{swap_cost:,.0f}, then £{monthly:,.0f} a month less"
      text: "You swapped. Fuel costs £{monthly:,.0f} a month less."
      good: false
      effects: { cash: -swap_cost, living: -monthly, happiness: 2 }

- id: car.speeding_fine
  area: car
  emoji: "📸"
  title: Caught speeding
  text: "A camera caught you at 36 in a 30 zone. Pay a £{fine:,.0f} fine and take 3 points, or take a course for £{course:,.0f}."
  concept_id: car-costs
  eligible:
    when: has_car
  probability: 0.04
  facts:
    fine: 100
    course: round(95 * price_level)
    premium_rise: round(80 * price_level)
    total: fine + premium_rise
  choices:
    - id: fine
      label: Pay the fine
      emoji: "💷"
      hint: "-£{fine:,.0f}, insurance rises £{premium_rise:,.0f}"
      default: true
      text: "You paid £{fine:,.0f}. Your insurance rose £{premium_rise:,.0f}."
      good: false
      effects: { cash: -total }
    - id: course
      label: Take the course
      emoji: "📚"
      hint: "-£{course:,.0f}, no points"
      text: "You took the course for £{course:,.0f}. No points."
      good: true
      effects: { cash: -course, smarts: 1 }

- id: car.parking_ticket
  area: car
  emoji: "🅿️"
  title: Parking ticket
  text: "You got a £{full:,.0f} ticket. It halves to £{early:,.0f} if you pay within 14 days."
  concept_id: budgeting
  eligible:
    when: has_car
  probability: 0.06
  facts:
    full: round(70 * price_level)
    early: round(full / 2)
  choices:
    - id: pay_early
      label: Pay early
      emoji: "⏱️"
      hint: "-£{early:,.0f}"
      default: true
      text: "You paid £{early:,.0f}."
      good: true
      effects: { cash: -early }
    - id: appeal
      label: Appeal it
      emoji: "⚖️"
      hint: Could win, or pay £{full:,.0f}
      branches:
        - p: 0.35
          text: "Appeal won. You paid nothing."
          good: true
          effects: { smarts: 1 }
        - text: "Appeal lost. You paid the full £{full:,.0f}."
          good: false
          effects: { cash: -full, happiness: -1 }

- id: car.clean_air_zone
  area: car
  emoji: "🌫️"
  title: A clean air zone opens
  text: "Your old car is not compliant. Driving in costs £{daily:,.0f} a day, about £{annual:,.0f} a year. A scrappage grant pays £{grant:,.0f}."
  concept_id: depreciation
  eligible:
    years: [2019, 2100]
    when: has_car
  probability: 0.03
  facts:
    daily: round(12.5 * price_level)
    annual: daily * 60
    grant: round(2000 * price_level)
    newer: round(6000 * price_level)
    flag_off: 0
  choices:
    - id: pay
      label: Pay the charge
      emoji: "💷"
      hint: "-£{annual:,.0f} a year"
      default: true
      text: "You paid £{annual:,.0f} in charges this year."
      good: false
      effects: { cash: -annual }
    - id: scrap
      label: Scrap it and go car-free
      emoji: "🚲"
      hint: "+£{grant:,.0f} grant"
      text: "You scrapped the car for a £{grant:,.0f} grant."
      good: true
      effects: { cash: grant, set_has_car: flag_off, happiness: -2 }
    - id: upgrade
      label: Buy a newer car
      emoji: "🚙"
      hint: "-£{newer:,.0f}, +£{grant:,.0f} grant"
      text: "You bought a compliant car. Net cost £{newer:,.0f} less the grant."
      good: false
      effects: { cash: grant - newer, happiness: 2 }

- id: car.finance_offer
  area: car
  emoji: "✨"
