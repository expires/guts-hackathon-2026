  text: "You are ill for a week. You get statutory sick pay only, so you lose about £{lost:,.0f}."
  concept_id: income-protection
  eligible:
    age: [18, 66]
    when: employed
  probability: 0.08
  facts:
    lost: round(max(net_income / 52 - 118.75 * price_level, 0))
    worse: round(lost * 2)
  choices:
    - id: rest
      label: Stay home
      emoji: "🛌"
      hint: "-£{lost:,.0f}"
      default: true
      text: "You rested and lost £{lost:,.0f}."
      good: true
      effects: { cash: -lost }
    - id: work
      label: Work through it
      emoji: "😷"
      hint: You might get worse
      branches:
        - p: 0.5
          text: "You got through it."
          good: true
          effects: { health: -2 }
        - text: "You got worse and lost £{worse:,.0f} in the end."
          good: false
          effects: { cash: -worse, health: -5 }

