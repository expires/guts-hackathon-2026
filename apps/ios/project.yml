# BOSS-owned. Generate with `make ios-gen`. Never edit Lifeline.xcodeproj by hand.
name: Lifeline
configs:
  Debug: debug
  Mock: debug
  Demo: release
  Dev: release
  Release: release
options:
  bundleIdPrefix: com.lifeline
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Mock: Config/Base.xcconfig
  Demo: Config/Base.xcconfig
  Dev: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
packages:
  OpenAPIGenerator:
    url: https://github.com/apple/swift-openapi-generator
    from: 1.6.0
  OpenAPIRuntime:
    url: https://github.com/apple/swift-openapi-runtime
    from: 1.7.0
  OpenAPIURLSession:
    url: https://github.com/apple/swift-openapi-urlsession
    from: 1.0.2
targets:
  Lifeline:
    type: application
    platform: iOS
    sources:
      - path: Lifeline
      - path: Lifeline.storekit
        optional: true
        buildPhase: none
    dependencies:
      - package: OpenAPIRuntime
        product: OpenAPIRuntime
      - package: OpenAPIURLSession
        product: OpenAPIURLSession
    buildToolPlugins:
      - plugin: OpenAPIGenerator
        package: OpenAPIGenerator
    info:
      path: Lifeline/Info.plist
      properties:
        CFBundleDisplayName: $(LIFELINE_DISPLAY_NAME)
        LifelineCheckpoint: $(LIFELINE_CHECKPOINT)
        LifelineBuildTime: $(LIFELINE_BUILD_TIME)
        LifelineFeatures: $(LIFELINE_FEATURES)
        UIDesignRequiresCompatibility: true
        NSCameraUsageDescription: Scan a room QR code to join a Same Life room.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.lifeline.app
            CFBundleURLSchemes: [lifeline]
        LifelineAPIBaseURL: $(LIFELINE_API_BASE_URL)
        LifelineClient: $(LIFELINE_CLIENT)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LIFELINE_BUNDLE_ID)
        LIFELINE_CLIENT: live
        LIFELINE_DISPLAY_NAME: Penny
        LIFELINE_CHECKPOINT: ""
        LIFELINE_BUILD_TIME: ""
        LIFELINE_FEATURES: ""
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Mock:
          LIFELINE_CLIENT: mock
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG MOCK
        Demo:
          LIFELINE_CLIENT: live
          LIFELINE_API_BASE_URL: https://api-production-15615.up.railway.app
        Dev:
          LIFELINE_CLIENT: live
          LIFELINE_API_BASE_URL: https://api-production-15615.up.railway.app
          LIFELINE_DISPLAY_NAME: Penny Dev
          PRODUCT_BUNDLE_IDENTIFIER: $(LIFELINE_BUNDLE_ID).dev
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDev
  LifelineTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LifelineTests]
    dependencies:
      - target: Lifeline
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
  LifelineUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [LifelineUITests]
    dependencies:
      - target: Lifeline
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: Lifeline
schemes:
  Playground:
    build:
      targets:
        Lifeline: all
    run:
      config: Mock
      commandLineArguments:
        "-playground": true
    profile:
      config: Mock
    archive:
      config: Mock
  Lifeline:
    build:
      targets:
        Lifeline: all
        LifelineTests: [test]
        LifelineUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Lifeline.storekit
    test:
      config: Debug
      targets:
        - LifelineTests
        - LifelineUITests
