      responses:
        '200':
          description: text/event-stream; each `data:` line is one ChatStreamEvent (JSON)
          content:
            text/event-stream:
              schema:
                type: string
                x-event-schema:
                  $ref: '#/components/schemas/ChatStreamEvent'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/StoreUnavailable'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '501':
          $ref: '#/components/responses/NotImplemented'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
            examples:
              ChatAsk:
                $ref: '#/components/examples/ChatAsk'
  /v1/chat/threads:
    get:
      operationId: listChatThreads
      summary: The caller's chat threads
      tags:
      - chat
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatThreadsResponse'
              examples:
                ChatThreads:
                  $ref: '#/components/examples/ChatThreads'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/StoreUnavailable'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /v1/chat/threads/{id}:
    get:
      operationId: getChatThread
      summary: One thread with its messages and answer groups
      tags:
      - chat
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatThread'
              examples:
                ChatThread:
                  $ref: '#/components/examples/ChatThread'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/StoreUnavailable'
        '501':
          $ref: '#/components/responses/NotImplemented'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_.:-]{1,64}$
  /v1/news:
    get:
      operationId: listNews
      summary: Guardian headlines and links for a date range (context only)
      tags:
      - chat
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsResponse'
              examples:
                News:
                  $ref: '#/components/examples/News'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/StoreUnavailable'
        '501':
          $ref: '#/components/responses/NotImplemented'
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: topic
        in: query
        required: false
        schema:
          type: string
          enum:
          - rates
          - mortgages
          - housing
          - inflation
          - energy
          - jobs
          - markets
          - economy
  /v1/rate-decisions:
    get:
      operationId: getRateDecisions
      summary: Bank of England rate-decision dates (context only)
      tags:
      - chat
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateDecisions'
              examples:
                RateDecisions:
                  $ref: '#/components/examples/RateDecisions'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/StoreUnavailable'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /v1/purchases/verify:
    post:
      operationId: verifyPurchase
      summary: Verify a StoreKit purchase. DEMO ONLY.
      tags:
      - store
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseVerifyResponse'
              examples:
                PurchaseVerifyResponse:
                  $ref: '#/components/examples/PurchaseVerifyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/StoreUnavailable'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '501':
          $ref: '#/components/responses/NotImplemented'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseVerifyRequest'
            examples:
              PurchaseVerify:
                $ref: '#/components/examples/PurchaseVerify'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Account:
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          enum:
          - current
          - savings
          - credit
          - isa
          - pension
          - mortgage
          - loan
          type: string
        provider:
          type: string
        balance:
          description: gbp; negative for money owed
          type: number
        currency:
          const: GBP
          default: GBP
          type: string
      required:
      - id
      - name
      - kind
      - provider
      - balance
      type: object
    ActionRequest:
      additionalProperties: false
      properties:
        tab:
          enum:
          - job
          - assets
          - relationships
          - activities
          - money
          type: string
        action_id:
          maxLength: 64
          minLength: 1
          type: string
        params:
          maxProperties: 10
          patternProperties:
            ^[A-Za-z0-9_]+$:
              anyOf:
              - type: number
              - maxLength: 64
                type: string
          propertyNames:
            maxLength: 32
            minLength: 1
          type: object
      required:
      - tab
      - action_id
      type: object
    ActionResult:
      additionalProperties: false
      properties:
        life:
          $ref: '#/components/schemas/Life'
        outcome:
          $ref: '#/components/schemas/Outcome'
        lesson:
          $ref: '#/components/schemas/Lesson'
        concept_unlocked:
          type: string
      required:
      - life
      - outcome
      type: object
    AddPlanItemRequest:
      additionalProperties: false
      properties:
        move_id:
          maxLength: 64
          minLength: 1
          type: string
      required:
      - move_id
      type: object
    AgeResult:
      additionalProperties: false
      properties:
        life:
          $ref: '#/components/schemas/Life'
        events:
          items:
            $ref: '#/components/schemas/Event'
          type: array
        lesson:
          $ref: '#/components/schemas/Lesson'
      required:
      - life
      - events
      type: object
    Alternative:
      additionalProperties: false
      properties:
        action:
          type: string
        score:
          type: number
        success_rate:
          maximum: 1
          minimum: 0
          type: number
      required:
      - action
      - score
      - success_rate
      type: object
    AmountPart:
      additionalProperties: false
      description: One line of a shown total, so Why? can show the calculation (ADR 0053, bug 2).
      properties:
        label:
          description: e.g. 'Current account you entered'
          maxLength: 80
          type: string
        amount:
          type: number
      required:
      - label
      - amount
      type: object
    AppleSignInRequest:
      additionalProperties: false
      properties:
        identity_token:
          maxLength: 8000
          minLength: 10
          type: string
      required:
      - identity_token
      type: object
    Asset:
      additionalProperties: false
      properties:
        id:
          type: string
        kind:
          enum:
          - home
          - car
          - investment
          - crypto
          - pension
          - business
          - other
          type: string
        name:
          type: string
        value:
          type: number
      required:
      - id
      - kind
      - name
      - value
      type: object
    AvailableAction:
      additionalProperties: false
      properties:
        tab:
          enum:
          - job
          - assets
          - relationships
          - activities
          - money
          type: string
        id:
          type: string
        label:
          type: string
        emoji:
          type: string
        hint:
          type: string
        enabled:
          default: true
          type: boolean
        paid:
          default: false
          type: boolean
      required:
      - tab
      - id
      - label
      type: object
    BacktestDay:
      additionalProperties: false
      properties:
        date:
          pattern: ^\d{4}-\d{2}-\d{2}$
          type: string
        predicted:
          type: number
        low:
          type: number
        high:
          type: number
        actual:
          type: number
        baseline:
          type: number
      required:
      - date
      - predicted
      - low
      - high
      - actual
      - baseline
      type: object
    BacktestPeriod:
      additionalProperties: false
      properties:
        start:
          type: integer
        end:
          type: integer
        recommended:
          type: string
        realised_best:
          type: string
        hit:
          type: boolean
      required:
      - start
      - end
      - recommended
      - realised_best
      - hit
      type: object
    BankAuthLink:
      additionalProperties: false
      properties:
        url:
          type: string
        state:
          type: string
        provider:
          type: string
        status:
          enum:
          - live
          - cached
          - mock
          - unavailable
          type: string
      required:
      - url
      - state
      - provider
      - status
      type: object
    BankSummary:
      additionalProperties: false
      properties:
        status:
          enum:
          - live
          - cached
          - mock
          - unavailable
          type: string
        provider:
          type: string
        profile:
          $ref: '#/components/schemas/DecisionProfile'
        accounts:
          type: integer
      required:
      - status
      - provider
      - profile
      - accounts
      type: object
    Bill:
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        emoji:
          type: string
        kind:
          enum:
          - bill
          - subscription
          - rent
          - mortgage
          - loan
          - card
          type: string
        amount:
          minimum: 0
          type: number
        due_date:
          pattern: ^\d{4}-\d{2}-\d{2}$
          type: string
        status:
          enum:
          - upcoming
          - due_soon
          - paid
          - overdue
          type: string
      required:
      - id
      - name
      - emoji
      - kind
      - amount
      - due_date
      - status
      type: object
    BillsResponse:
      additionalProperties: false
      properties:
        meta:
          $ref: '#/components/schemas/FinanceMeta'
        total_next_30_days:
          minimum: 0
          type: number
        items:
          items:
            $ref: '#/components/schemas/Bill'
          type: array
      required:
      - meta
      - total_next_30_days
      - items
      type: object
    BubbleEvent:
      additionalProperties: false
      properties:
        bubble:
          $ref: '#/components/schemas/ChatBubble'
        highlights:
          items:
            $ref: '#/components/schemas/Highlight'
          type: array
      required:
      - bubble
      type: object
    Budget:
      additionalProperties: false
      properties:
        category:
          enum:
          - groceries
          - eating_out
          - transport
          - shopping
          - entertainment
          - bills
          - housing
          - subscriptions
          - health
          - travel
          - personal_care
          - education
          - gifts
          - transfers
          - income
          - savings
          - cash
          - fees
          - other
          type: string
        label:
          type: string
        emoji:
          type: string
        limit:
          minimum: 0
          type: number
        spent:
          minimum: 0
          type: number
        progress:
          description: spent / limit; can exceed 1
          minimum: 0
          type: number
        status:
          enum:
          - ok
          - near
          - over
          type: string
      required:
      - category
      - label
      - emoji
      - limit
      - spent
      - progress
      - status
      type: object
    BudgetLimit:
      additionalProperties: false
      properties:
        category:
          enum:
          - groceries
          - eating_out
          - transport
          - shopping
          - entertainment
          - bills
          - housing
          - subscriptions
          - health
          - travel
          - personal_care
          - education
          - gifts
          - transfers
          - income
          - savings
          - cash
          - fees
          - other
          type: string
        limit:
          maximum: 1000000
          minimum: 0
          type: number
      required:
      - category
      - limit
      type: object
    BudgetsResponse:
      additionalProperties: false
      properties:
        meta:
          $ref: '#/components/schemas/FinanceMeta'
        month:
          pattern: ^\d{4}-\d{2}$
          type: string
        items:
          items:
            $ref: '#/components/schemas/Budget'
          type: array
      required:
      - meta
      - month
      - items
      type: object
    CategorySpend:
      additionalProperties: false
      properties:
        category:
          enum:
          - groceries
          - eating_out
          - transport
          - shopping
          - entertainment
          - bills
          - housing
          - subscriptions
          - health
          - travel
          - personal_care
          - education
          - gifts
          - transfers
          - income
          - savings
          - cash
          - fees
          - other
          type: string
        label:
          type: string
        emoji:
          type: string
        amount:
          minimum: 0
          type: number
        share:
          maximum: 1
          minimum: 0
          type: number
        transactions:
          minimum: 0
          type: integer
        change_pct:
          description: vs previous month, percent
          type: number
      required:
      - category
      - label
      - emoji
      - amount
      - share
      - transactions
      type: object
    Challenge:
      additionalProperties: false
      properties:
        id:
          type: string
        title:
          type: string
        emoji:
          type: string
        description:
          type: string
        character_id:
          type: string
        start_year:
          type: integer
        goal:
          additionalProperties:
            anyOf:
            - type: number
            - type: string
          type: object
        scope:
          default: life
          description: '''you'' = scored on the user''s own data (ratios, no £); ''life'' = a game life'
          enum:
          - you
          - life
          type: string
      required:
      - id
      - title
      - emoji
      - description
      - character_id
      - start_year
      - goal
      type: object
    ChallengeProgress:
      additionalProperties: false
      properties:
        challenge_id:
          type: string
        life_id:
          description: Set for life challenges; None for scope 'you'
          type: string
        status:
          enum:
          - in_progress
          - won
          - lost
          type: string
        detail:
          maxLength: 200
          type: string
      required:
      - challenge_id
      - status
      type: object
    ChallengesResponse:
      additionalProperties: false
      properties:
        challenges:
          items:
            $ref: '#/components/schemas/Challenge'
          type: array
        progress:
          description: Caller's progress, when signed in
          items:
            $ref: '#/components/schemas/ChallengeProgress'
          type: array
      required:
      - challenges
      type: object
    CharacterSpec:
      additionalProperties: false
      description: Input for a new life. Presets and random characters are also CharacterSpec.
      properties:
        id:
          maxLength: 64
          minLength: 1
          pattern: ^[A-Za-z0-9_.:-]+$
          type: string
        name:
          maxLength: 40
          minLength: 1
          type: string
        emoji:
          default: 🙂
          maxLength: 8
          type: string
        sex:
          default: female
          enum:
          - female
          - male
          type: string
        occupation:
          description: e.g. nurse, plumber, banker
          maxLength: 60
          minLength: 1
          type: string
        region:
          description: Canonical region slug, see observation.REGIONS
          maxLength: 40
          minLength: 2
          pattern: ^[a-z-]+$
          type: string
        town:
          maxLength: 60
          type: string
        postcode:
          maxLength: 10
          type: string
        birth_year:
          maximum: 2026
          minimum: 1930
          type: integer
        annual_income:
          description: gbp gross per year at start
          maximum: 10000000
          minimum: 0
          type: number
        savings:
          default: 0
          maximum: 100000000
          minimum: 0
          type: number
        debt:
          default: 0
          maximum: 100000000
          minimum: 0
          type: number
        housing:
          default: rent
          enum:
          - parents
          - rent
          - own
          - mortgage
          type: string
        property_value:
          default: 0
          maximum: 100000000
          minimum: 0
          type: number
        mortgage_balance:
          default: 0
          maximum: 100000000
          minimum: 0
          type: number
        blurb:
          maxLength: 200
          type: string
      required:
      - name
      - occupation
      - region
      - town
      - birth_year
      - annual_income
      type: object
    CharactersResponse:
      additionalProperties: false
      properties:
        presets:
          items:
            $ref: '#/components/schemas/CharacterSpec'
          type: array
        random:
          $ref: '#/components/schemas/CharacterSpec'
      required:
      - presets
      - random
      type: object
    Chart:
      additionalProperties: false
      properties:
        kind:
          enum:
          - line
          - bar
          type: string
        title:
          type: string
        x_label:
          type: string
        y_label:
          type: string
        points:
          items:
            $ref: '#/components/schemas/ChartPoint'
          type: array
        source:
          $ref: '#/components/schemas/SourceRef'
      required:
      - kind
      - title
      - x_label
      - y_label
      - points
      type: object
    ChartPoint:
      additionalProperties: false
      properties:
        x:
          type: number
        y:
          type: number
        label:
          type: string
      required:
      - x
      - y
      type: object
    ChatBubble:
      additionalProperties: false
      properties:
        id:
          type: string
        kind:
          enum:
          - answer
          - caveat
          - question
          - general_knowledge
          type: string
        text:
          maxLength: 600
          type: string
      required:
      - id
      - kind
      - text
      type: object
    ChatContext:
      additionalProperties: false
      properties:
        next_move_id:
          maxLength: 64
          minLength: 1
          pattern: ^[A-Za-z0-9_.:-]+$
          type: string
        life_id:
          maxLength: 64
          minLength: 1
          pattern: ^[A-Za-z0-9_.:-]+$
          type: string
        event_id:
          maxLength: 64
          minLength: 1
          pattern: ^[A-Za-z0-9_.:-]+$
          type: string
        screen:
          enum:
          - money
          - next_move
          - why
          - life_event
          - life
          - other
          type: string
      type: object
    ChatFact:
      additionalProperties: false
      description: A number Penny may say. From a tool result or the official facts table.
      properties:
        id:
          type: string
        value:
          type: number
        unit:
          enum:
          - gbp
          - gbp_per_month
          - gbp_per_year
          - percent
          - months
          - years
          - count
          - date_year
          type: string
        label:
          maxLength: 120
          type: string
        source_id:
          type: string
      required:
      - id
      - value
      - unit
      - label
      type: object
    ChatMessage:
      additionalProperties: false
      properties:
        id:
          type: string
        role:
          enum:
          - user
          - penny
          type: string
        created_at:
          type: string
        text:
          description: User message text
          type: string
        reply_to:
          type: string
        response:
          description: Penny's answer group
          $ref: '#/components/schemas/ChatResponse'
        replies:
          default: 0
          description: N Replies under a user bubble
          minimum: 0
          type: integer
      required:
      - id
      - role
      - created_at
      type: object
    ChatRequest:
      additionalProperties: false
      properties:
        message:
          maxLength: 2000
          minLength: 1
          type: string
        thread_id:
          description: Omit to start a new thread
          maxLength: 64
          minLength: 1
          pattern: ^[A-Za-z0-9_.:-]+$
          type: string
        reply_to:
          description: Message id this question replies to
          maxLength: 64
          minLength: 1
          pattern: ^[A-Za-z0-9_.:-]+$
          type: string
        context:
          $ref: '#/components/schemas/ChatContext'
      required:
      - message
      type: object
    ChatResponse:
      additionalProperties: false
      properties:
        thread_id:
          type: string
        message_id:
          type: string
        reply_to:
          description: The user's message id this answer group attaches to
          type: string
        reaction:
          enum:
          - eyes
          - brain
          - thumbs
          - tick
          - question
          - shrug
          type: string
        mode:
          default: checked
          enum:
          - checked
          - general
          type: string
        bubbles:
          description: 'Voice: usually one bubble, two at most'
          items:
            $ref: '#/components/schemas/ChatBubble'
          maxItems: 2
          minItems: 1
          type: array
        highlights:
          items:
            $ref: '#/components/schemas/Highlight'
          type: array
        facts:
          items:
            $ref: '#/components/schemas/ChatFact'
          type: array
        sources:
          items:
            $ref: '#/components/schemas/ChatSource'
          type: array
        follow_up_question:
          maxLength: 300
          type: string
        suggestions:
          description: Follow-up chips, e.g. 'Next move', 'Summary'. Never a lone 'Yes'.
          items:
            type: string
          maxItems: 2
          type: array
        confidence:
          maximum: 1
          minimum: 0
          type: number
        tool_calls:
          items:
            $ref: '#/components/schemas/ToolCall'
          maxItems: 5
          type: array
        verified:
          description: True when every number passed the verifier; False means template summary
          type: boolean
        summary_available:
          default: false
          type: boolean
        links:
          description: In-app destinations, e.g. the out-of-scope reply links to the Next Move
          items:
            enum:
            - next_move
            - test_it
            - why
            - plan
            type: string
          maxItems: 3
          type: array
        disclaimer:
          const: Penny is AI and can make mistakes. Guidance only, not regulated financial advice. Check before big decisions.
          default: Penny is AI and can make mistakes. Guidance only, not regulated financial advice. Check before big decisions.
          type: string
      required:
      - thread_id
      - message_id
      - reply_to
      - reaction
      - bubbles
      - confidence
      - verified
      type: object
    ChatSource:
      additionalProperties: false
      properties:
        id:
          type: string
        group:
          enum:
          - your_data
          - live_sources
          - general_knowledge
          type: string
        label:
          maxLength: 120
          type: string
        ref:
          $ref: '#/components/schemas/SourceRef'
        url:
          maxLength: 500
          type: string
        updated_at:
          type: string
      required:
      - id
      - group
      - label
      type: object
