<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Play room lobby</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F2EA; color: #16181D; font-family: 'Atkinson Hyperlegible', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="flex: 1; padding: 20px 20px 16px; display: flex; flex-direction: column; gap: 14px">

    <div style="display: flex; align-items: center; gap: 12px; height: 44px">
      <h1 style="flex: 1; margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px">Play</h1>
      <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; padding: 3px 10px; border: 2px solid #16181D; border-radius: 12px 16px 11px 15px / 15px 11px 16px 12px; background: #FFFFFF"><dc-import name="Icon" icon="status-mock" size="{{24}}" hint-size="24px,24px"></dc-import>Mock data</span>
    </div>

    <div role="tablist" aria-label="Play sections" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 3px solid #16181D; border-radius: 14px 18px 13px 17px / 17px 13px 18px 14px; background: #FFFFFF; overflow: hidden">
      <button type="button" role="tab" aria-selected="true" style="height: 40px; border: none; background: #16181D; color: #FFFFFF; font-family: 'Atkinson Hyperlegible', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer">Rooms</button>
      <button type="button" role="tab" aria-selected="false" style="height: 40px; border: none; border-left: 3px solid #16181D; background: #FFFFFF; color: #16181D; font-family: 'Atkinson Hyperlegible', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer">Challenges</button>
      <button type="button" role="tab" aria-selected="false" style="height: 40px; border: none; border-left: 3px solid #16181D; background: #FFFFFF; color: #16181D; font-family: 'Atkinson Hyperlegible', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer">Collection</button>
    </div>

    <section aria-label="Room code" style="background: #FFFFFF; border: 3px solid #16181D; border-radius: 22px 30px 20px 28px / 28px 20px 30px 22px; box-shadow: 6px 7px 0 #16181D; padding: 16px; display: flex; align-items: center; gap: 12px">
      <div style="flex: 1">
        <div style="font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase">Same Life room</div>
        <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 40px; line-height: 1.05">LEEDS-42</div>
      </div>
      <button type="button" style="height: 44px; padding: 0 16px; border: 3px solid #16181D; border-radius: 12px 16px 11px 15px / 15px 11px 16px 12px; background: #FFFFFF; color: #16181D; font-family: 'Atkinson Hyperlegible', sans-serif; font-size: 17px; font-weight: 700; cursor: pointer">Share</button>
    </section>

    <div style="display: flex; flex-direction: column; gap: 6px; padding: 0 4px">
      <div style="font-size: 17px; font-weight: 700">Everyone plays the same life</div>
      <div style="display: flex; gap: 10px; align-items: flex-start"><dc-import name="Icon" icon="face-priya" size="{{48}}" hint-size="48px,48px"></dc-import><div style="font-size: 17px; line-height: 1.4">Priya, 29, nurse, Leeds. Sep 2021 to Sep 2031. Same events. Your own pace.</div></div>
      <div style="font-size: 13px; color: #4A4F59">10 years · 2 rewinds each · real rates to 2026</div>
    </div>

    <div style="display: flex; flex-direction: column">
      <div style="font-size: 17px; font-weight: 700; padding-bottom: 4px">Players · 4 of 6</div>
      <div style="display: flex; align-items: center; gap: 12px; height: 48px; border-bottom: 2px solid #DDD8CC"><dc-import name="Icon" icon="face-teen" size="{{32}}" hint-size="32px,32px"></dc-import><span style="flex: 1; font-size: 17px"><b>You</b> · host</span><span style="font-size: 13px; font-weight: 700; padding: 2px 8px; border: 2px solid #16181D; border-radius: 8px 11px 7px 10px; background: #3FB57A">Ready</span></div>
      <div style="display: flex; align-items: center; gap: 12px; height: 48px; border-bottom: 2px solid #DDD8CC"><dc-import name="Icon" icon="face-woman-puff" size="{{32}}" hint-size="32px,32px"></dc-import><span style="flex: 1; font-size: 17px">Ava</span><span style="font-size: 13px; font-weight: 700; padding: 2px 8px; border: 2px solid #16181D; border-radius: 8px 11px 7px 10px; background: #3FB57A">Ready</span></div>
      <div style="display: flex; align-items: center; gap: 12px; height: 48px; border-bottom: 2px solid #DDD8CC"><dc-import name="Icon" icon="face-man-beard" size="{{32}}" hint-size="32px,32px"></dc-import><span style="flex: 1; font-size: 17px">Tom</span><span style="font-size: 13px; font-weight: 700; padding: 2px 8px; border: 2px solid #16181D; border-radius: 8px 11px 7px 10px; background: #3FB57A">Ready</span></div>
      <div style="display: flex; align-items: center; gap: 12px; height: 48px"><dc-import name="Icon" icon="face-teen-hijab" size="{{32}}" hint-size="32px,32px"></dc-import><span style="flex: 1; font-size: 17px">Jas</span><span style="font-size: 13px; font-weight: 700; padding: 2px 8px; border: 2px dashed #16181D; border-radius: 8px 11px 7px 10px; background: #FFFFFF">Joining…</span></div>
    </div>

    <a href="Play-Live.dc.html" style="margin-top: auto; height: 52px; box-sizing: border-box; border: 3px solid #16181D; border-radius: 14px 20px 12px 18px / 18px 12px 20px 14px; background: #16181D; color: #FFFFFF; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">Start with 4 players</a>
  </div>

  <nav aria-label="Tabs" style="height: 80px; flex: none; background: #FFFFFF; border-top: 3px solid #16181D; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: center">
    <a href="Money-Home.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #16181D; text-decoration: none; font-size: 13px"><dc-import name="Icon" icon="tab-money" size="{{28}}" hint-size="28px,28px"></dc-import>Money</a>
    <a href="Life-Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #16181D; text-decoration: none; font-size: 13px"><dc-import name="Icon" icon="tab-life" size="{{28}}" hint-size="28px,28px"></dc-import>Life</a>
    <a href="Play-Lobby.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #16181D; text-decoration: none; font-size: 13px; font-weight: 700"><dc-import name="Icon" icon="tab-play" size="{{28}}" active="{{true}}" hint-size="28px,28px"></dc-import>Play</a>
    <a href="You-Profile.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #16181D; text-decoration: none; font-size: 13px"><dc-import name="Icon" icon="tab-you" size="{{28}}" hint-size="28px,28px"></dc-import>You</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
