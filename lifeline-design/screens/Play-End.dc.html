<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Room results</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F2EA; color: #16181D; font-family: 'Atkinson Hyperlegible', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="flex: 1; padding: 20px 20px 16px; display: flex; flex-direction: column; gap: 16px">

    <div style="display: flex; align-items: center; gap: 12px; height: 44px">
      <div style="flex: 1">
        <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px">Room results</h1>
        <div style="font-size: 13px; color: #4A4F59">LEEDS-42 · Sep 2021 to Sep 2031</div>
      </div>
      <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; padding: 3px 10px; border: 2px solid #16181D; border-radius: 12px 16px 11px 15px / 15px 11px 16px 12px; background: #FFFFFF"><dc-import name="Icon" icon="status-mock" size="{{24}}" hint-size="24px,24px"></dc-import>Mock data</span>
    </div>

    <section aria-label="Winner" style="background: #FFFFFF; border: 3px solid #16181D; border-radius: 22px 30px 20px 28px / 28px 20px 30px 22px; box-shadow: 6px 7px 0 #16181D; padding: 16px; display: flex; align-items: center; gap: 14px">
      <dc-import name="Icon" icon="trophy" size="{{64}}" hint-size="64px,64px"></dc-import>
      <div style="flex: 1">
        <div style="font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase">Winner</div>
        <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px">Ava · INDEX 131</div>
        <div style="font-size: 13px; color: #4A4F59">Fixed for 5 years in 2021</div>
      </div>
    </section>

    <div style="display: flex; flex-direction: column; gap: 4px">
      <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 17px; font-weight: 700">INDEX vs autopilot</span><span style="font-size: 13px; color: #4A4F59">Line = autopilot 100</span></div>
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; gap: 10px; height: 56px; border-bottom: 2px solid #DDD8CC">
          <span style="width: 16px; font-size: 13px; font-weight: 700">{{r.rank}}</span>
          <dc-import name="Icon" icon="{{r.face}}" size="{{32}}" hint-size="32px,32px"></dc-import>
          <div style="flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0">
            <div style="display: flex; justify-content: space-between; font-size: 13px"><b>{{r.name}}</b><span>{{r.note}}</span></div>
            <div style="position: relative; height: 12px; border: 3px solid #16181D; border-radius: 7px 10px 6px 9px; background: #FFFFFF; overflow: hidden">
              <div style="width: {{r.w}}; height: 100%; background: {{r.c}}; border-right: 3px solid #16181D"></div>
              <div style="position: absolute; left: 33%; top: 0; bottom: 0; width: 3px; background: #16181D"></div>
            </div>
          </div>
          <b style="width: 36px; text-align: right; font-family: 'Bricolage Grotesque', sans-serif; font-size: 17px">{{r.score}}</b>
        </div>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 17px; font-weight: 700">You earned</div>
      <div style="display: flex; gap: 16px">
        <div style="display: flex; align-items: center; gap: 8px; font-size: 13px"><dc-import name="Icon" icon="ribbon" size="{{32}}" hint-size="32px,32px"></dc-import>Rate shock survivor</div>
        <div style="display: flex; align-items: center; gap: 8px; font-size: 13px"><dc-import name="Icon" icon="lesson" size="{{32}}" hint-size="32px,32px"></dc-import>2 new concepts</div>
      </div>
    </div>

    <div style="margin-top: auto; display: flex; gap: 8px">
      <a href="Play-Lobby.dc.html" style="flex: 1; height: 52px; box-sizing: border-box; border: 3px solid #16181D; border-radius: 14px 20px 12px 18px / 18px 12px 20px 14px; background: #16181D; color: #FFFFFF; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">Rematch</a>
      <button type="button" style="flex: 1; height: 52px; border: 3px solid #16181D; border-radius: 18px 12px 20px 14px / 14px 20px 12px 18px; background: #FFFFFF; color: #16181D; font-family: 'Atkinson Hyperlegible', sans-serif; font-size: 17px; font-weight: 700; cursor: pointer">Share results</button>
    </div>
  </div>

  <nav aria-label="Tabs" style="height: 80px; flex: none; background: #FFFFFF; border-top: 3px solid #16181D; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: center">
    <a href="Money-Home.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #16181D; text-decoration: none; font-size: 13px"><dc-import name="Icon" icon="tab-money" size="{{28}}" hint-size="28px,28px"></dc-import>Money</a>
    <a href="Life-Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #16181D; text-decoration: none; font-size: 13px"><dc-import name="Icon" icon="tab-life" size="{{28}}" hint-size="28px,28px"></dc-import>Life</a>
    <a href="Play-Lobby.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #16181D; text-decoration: none; font-size: 13px; font-weight: 700"><dc-import name="Icon" icon="tab-play" size="{{28}}" active="{{true}}" hint-size="28px,28px"></dc-import>Play</a>
    <a href="You-Profile.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #16181D; text-decoration: none; font-size: 13px"><dc-import name="Icon" icon="tab-you" size="{{28}}" hint-size="28px,28px"></dc-import>You</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    // Bar scale: 70 at 0% to 160 at 100%, so 100 sits at 33%
    function w(s) { return Math.round((s - 70) / 90 * 100) + '%'; }
    var rows = [
      { rank: 1, name: 'Ava', face: 'face-woman-puff', score: 131, note: '5-year fix', c: '#3FB57A' },
      { rank: 2, name: 'You', face: 'face-teen', score: 118, note: 'Rewound once', c: '#3FB57A' },
      { rank: 3, name: 'Tom', face: 'face-man-beard', score: 104, note: 'Cleared card', c: '#3FB57A' },
      { rank: 4, name: 'Jas', face: 'face-teen-hijab', score: 91, note: 'Hit by rate rise', c: '#FF7A8A' }
    ].map(function (r) { r.w = w(r.score); return r; });
    return { rows: rows };
  }
}
</script>
</body>
</html>
