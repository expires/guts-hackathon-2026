<script type="text/x-dc" data-dc-script data-props='{"icon":{"editor":"enum","options":["tab-money","tab-life","tab-play","tab-you","home","car","bank","card","savings","pension","cart","subscriptions","bills","budget","goal","investment","debt","job","study","health","family","relationships","activities","travel","pet","happiness","rate-rise","price-rise","job-loss","pay-rise","crash","flood","burglary","baby","wedding","inheritance","boiler","mot-fail","age","rewind","test","why","check","lesson","ribbon","trophy","streak","lock","demo-pay","status-live","status-cached","status-mock","face-baby","face-girl","face-boy","face-teen","face-teen-hijab","face-woman-puff","face-man-beard","face-priya","face-man-glasses","face-blue-hair","face-older-woman","face-older-man"],"default":"home"},"size":{"editor":"enum","options":[24,32,48,64],"default":48},"active":{"editor":"boolean","default":false},"$preview":{"width":48,"height":48}}'>
class Component extends DCLogic {
  renderVals() {
    var icon = this.props.icon || 'home';
    var size = Number(this.props.size) || 48;
    var is = {};
    is[icon.replace(/-/g, '_')] = true;
    // Optical stroke: 3px at 48, 2.75px at 32, 2.5px at 24 (in 48-unit grid)
    var px = size <= 24 ? 2.5 : size <= 32 ? 2.75 : 3;
    var sw = px * 48 / size;
    var on = !!this.props.active;
    var tabFill = {
      money: on ? '#3FB57A' : '#FFFFFF',
      life: on ? '#FF7A8A' : '#FFFFFF',
      play: on ? '#A78BFA' : '#FFFFFF',
      you: on ? '#6C8EF5' : '#FFFFFF'
    };
    return { is: is, size: size, px: size + 'px', sw: sw, tabFill: tabFill };
  }
}
</script>
