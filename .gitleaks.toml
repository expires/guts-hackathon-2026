# BOSS-owned. Extends the default ruleset. .env is never committed, so skip it.
[extend]
useDefault = true

[allowlist]
description = "local-only and generated paths"
regexTarget = "line"
# False positive: code comparing an enum, e.g. `key == MacroKey.MORTGAGE_2Y_FIX`.
regexes = [
  '''key ={1,2} MacroKey\.[A-Z0-9_]+''',
]
paths = [
  '''(^|/)\.env$''',
  '''(^|/)\.venv/''',
  '''(^|/)\.git/''',
  '''DerivedData/''',
  '''(^|/)build/''',
  '''\.xcodeproj/''',
]
