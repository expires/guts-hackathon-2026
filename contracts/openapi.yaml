components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Account:
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          enum:
          - current
          - savings
          - credit
          - isa
          - pension
          - mortgage
          - loan
          type: string
        provider:
          type: string
        balance:
          description: gbp; negative for money owed
          type: number
        currency:
          const: GBP
          default: GBP
          type: string
      required:
      - id
      - name
      - kind
      - provider
      - balance
      type: object
    ActionRequest:
      additionalProperties: false
      properties:
        tab:
          enum:
          - job
          - assets
          - relationships
          - activities
          - money
          type: string
        action_id:
          maxLength: 64
          minLength: 1
          type: string
        params:
          maxProperties: 10
          patternProperties:
            ^[A-Za-z0-9_]+$:
              anyOf:
              - type: number
              - maxLength: 64
                type: string
          propertyNames:
            maxLength: 32
            minLength: 1
          type: object
      required:
      - tab
      - action_id
      type: object
    ActionResult:
      additionalProperties: false
      properties:
        life:
          $ref: '#/components/schemas/Life'
        outcome:
          $ref: '#/components/schemas/Outcome'
        lesson:
          $ref: '#/components/schemas/Lesson'
        concept_unlocked:
          type: string
      required:
      - life
      - outcome
      type: object
    AddPlanItemRequest:
      additionalProperties: false
      properties:
        move_id:
          maxLength: 64
          minLength: 1
          type: string
      required:
      - move_id
      type: object
    AgeResult:
      additionalProperties: false
      properties:
        life:
          $ref: '#/components/schemas/Life'
        events:
          items:
            $ref: '#/components/schemas/Event'
          type: array
        lesson:
          $ref: '#/components/schemas/Lesson'
      required:
      - life
      - events
      type: object
    Alternative:
      additionalProperties: false
      properties:
        action:
          type: string
        score:
          type: number
        success_rate:
          maximum: 1
          minimum: 0
          type: number
      required:
      - action
      - score
      - success_rate
      type: object
    AppleSignInRequest:
      additionalProperties: false
      properties:
        identity_token:
          maxLength: 8000
          minLength: 10
          type: string
      required:
      - identity_token
      type: object
    Asset:
      additionalProperties: false
      properties:
        id:
          type: string
        kind:
          enum:
          - home
          - car
          - investment
          - crypto
          - pension
          - business
          - other
          type: string
        name:
          type: string
        value:
          type: number
      required:
      - id
      - kind
      - name
      - value
      type: object
    AvailableAction:
      additionalProperties: false
      properties:
        tab:
          enum:
          - job
          - assets
          - relationships
          - activities
          - money
          type: string
        id:
          type: string
        label:
          type: string
        emoji:
          type: string
        hint:
          type: string
        enabled:
          default: true
          type: boolean
        paid:
          default: false
          type: boolean
      required:
      - tab
      - id
      - label
      type: object
    BacktestDay:
      additionalProperties: false
      properties:
        date:
          pattern: ^\d{4}-\d{2}-\d{2}$
          type: string
        predicted:
          type: number
        low:
          type: number
        high:
          type: number
        actual:
          type: number
        baseline:
          type: number
      required:
      - date
      - predicted
      - low
      - high
      - actual
      - baseline
      type: object
    BacktestPeriod:
      additionalProperties: false
      properties:
        start:
          type: integer
        end:
          type: integer
        recommended:
          type: string
        realised_best:
          type: string
        hit:
          type: boolean
      required:
      - start
      - end
      - recommended
      - realised_best
      - hit
      type: object
    BankAuthLink:
      additionalProperties: false
      properties:
        url:
          type: string
        state:
          type: string
        provider:
          type: string
        status:
          enum:
          - live
          - cached
          - mock
          type: string
      required:
      - url
      - state
      - provider
      - status
      type: object
    BankSummary:
      additionalProperties: false
      properties:
        status:
          enum:
          - live
          - cached
          - mock
          type: string
        provider:
          type: string
        profile:
          $ref: '#/components/schemas/DecisionProfile'
        accounts:
          type: integer
      required:
      - status
      - provider
      - profile
      - accounts
      type: object
    Bill:
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        emoji:
          type: string
        kind:
          enum:
          - bill
          - subscription
          - rent
          - mortgage
          - loan
          - card
          type: string
        amount:
          minimum: 0
          type: number
        due_date:
          pattern: ^\d{4}-\d{2}-\d{2}$
          type: string
        status:
          enum:
          - upcoming
          - due_soon
          - paid
          - overdue
          type: string
      required:
      - id
      - name
      - emoji
      - kind
      - amount
      - due_date
      - status
      type: object
    BillsResponse:
      additionalProperties: false
      properties:
        meta:
          $ref: '#/components/schemas/FinanceMeta'
        total_next_30_days:
          minimum: 0
          type: number
        items:
          items:
            $ref: '#/components/schemas/Bill'
          type: array
      required:
      - meta
      - total_next_30_days
      - items
      type: object
    Budget:
      additionalProperties: false
      properties:
        category:
          enum:
          - groceries
          - eating_out
          - transport
          - shopping
          - entertainment
          - bills
          - housing
          - subscriptions
          - health
          - travel
          - personal_care
          - education
          - gifts
          - transfers
          - income
          - savings
          - cash
          - fees
          - other
          type: string
        label:
          type: string
        emoji:
          type: string
        limit:
          minimum: 0
          type: number
        spent:
          minimum: 0
          type: number
        progress:
          description: spent / limit; can exceed 1
          minimum: 0
          type: number
        status:
          enum:
          - ok
          - near
          - over
          type: string
      required:
      - category
      - label
      - emoji
      - limit
      - spent
      - progress
      - status
      type: object
    BudgetLimit:
      additionalProperties: false
      properties:
        category:
          enum:
          - groceries
          - eating_out
